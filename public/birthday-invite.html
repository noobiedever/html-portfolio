<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Birthday Invite</title>
  </head>

  <body>
    <!-- h1 and h2 tag describing the occasion and when -->
    <h1>Happy Birthday</h1>
    <h2>February 23</h2>

    <!-- img tag for birthday graphic -->
    <img src="https://i.pinimg.com/736x/c9/48/eb/c948eb2044b4a0c997db0e55af1236ad.jpg" height="325" alt="pisces birthday"/>
    
    <!-- h3 tag and unordered list (ul tag) displaying what to bring -->
    <h3>What to bring...</h3>
    <ul>
      <li>Food</li>
      <li>Drinks</li>
      <li>Yourself!!!</li>
    </ul>

    <!-- h3 tag and google map link (a tag) to give directions to the location of the party -->
    <h3>Location: </h3>
      <a href="https://maps.app.goo.gl/mEMGbhhEWZ8A4Ret7">
        167 Fairview RD<br/>
        APT 202<br/>
        Mooresville, NC 28117<br/>
      </a>

      <!-- p tag for link (a tag) to portfolio home -->
      <p>
        <a href="../index.html">Portfolio Home</a>
      </p>
  </body>
</html>
